spring.application.name=pc-autorent-jcoyh
server.port=8081

# Configuración de H2 Database para el proyecto pc-autorent-jcoyh
spring.datasource.url=jdbc:h2:mem:autorentdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Habilitar consola de H2 (accesible en http://localhost:8081/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Configuración de JPA / Hibernate
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect Desactivado por mensaje de recomendación en la consola
# Cambiado a none para que tome el archivo schema.sql
spring.jpa.hibernate.ddl-auto=update 
# spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=true

# # Desactivar la advertencia Open-In-View de la consola
# spring.jpa.open-in-view=false

# Ajuste de compatibilidad para asegurar el renderizado de la consola web
# spring.h2.console.settings.web-allow-others=true
# spring.jpa.open-in-view=true

# Asegura que el archivo data.sql se ejecute justo DESPUÉS de crear las tablas
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Archivo de datos persistentes para carga
# spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:import.sql
